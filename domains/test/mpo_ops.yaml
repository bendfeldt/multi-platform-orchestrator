# Operations code location (alert sensors, cost and insight reports). It reads platform
# metadata only, never business data:
# - Snowflake: a service user and role with USAGE on this warehouse; ACCOUNTADMIN grants the
#   role SNOWFLAKE.USAGE_VIEWER once (snowflake/cost_access.sql).
# - Databricks: a service principal with CAN_USE on the cost warehouse (environment/insights.tf);
#   a metastore admin grants it SELECT on system.billing once (README).
# - Fabric: Viewer on the monitoring workspace below.
# Like any domain it has Launcher and Editor roles; no group holds them until you list one.
snowflake:
  warehouse: MPO_OPS_WH_TEST  # an existing X-Small warehouse; example name
  schemas: []
databricks:
  schemas: []
# Fabric cost: Viewer on the workspace of the capacity-events Eventhouse (made outside
# Terraform; fabric/capacity_operations.kql). Uncomment with that workspace's ID.
# fabric:
#   workspaces:
#     - id: <monitoring workspace ID>
#       access: read
