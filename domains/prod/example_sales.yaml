# Domain example_sales in prod. The file name must equal the code location's name in the
# solution repo. Terraform creates the domain's identity and exactly these grants.
# access: read | write. IDs are examples; they differ per environment.
databricks:
  schemas:
    - name: sales_prod.silver   # catalog.schema
      access: write
fabric:
  workspaces:
    - id: 00000000-0000-0000-0000-000000000003
      access: write
snowflake:
  warehouse: SALES_WH_PROD
  schemas:
    - name: SALES_PROD.MART
      access: write
    - name: SALES_PROD.EXT
      access: read
