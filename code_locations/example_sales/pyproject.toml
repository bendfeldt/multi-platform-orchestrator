[project]
name = "example-sales"
version = "0.1.0"
description = "Example domain code location"
requires-python = ">=3.13,<3.14"
dependencies = ["orchestrator-core"]

[tool.uv.sources]
orchestrator-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "example_sales"
