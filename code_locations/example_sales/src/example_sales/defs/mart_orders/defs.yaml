# The Snowflake table reads Databricks data through an external table, so it declares the
# Databricks key as its upstream.
type: orchestrator_core.components.SnowflakeSql
attributes:
  name: mart_orders
  group_name: sales
  sql: |
    create or replace table sales.mart.fct_orders as
    select * from sales.ext.silver_orders;
  reads:
    - databricks/sales/silver/orders
  writes:
    - snowflake/sales/mart/fct_orders
  # Catalog: who owns it, how to find it, and its columns with their upstream columns.
  owners:
    - team:sales-data
  tags:
    layer: mart
    pii: "false"
  columns:
    snowflake/sales/mart/fct_orders:
      - name: order_id
        type: number
        description: One row per order.
        derived_from: ["databricks/sales/silver/orders:order_id"]
      - name: amount
        type: number(12,2)
        derived_from: ["databricks/sales/silver/orders:amount"]
