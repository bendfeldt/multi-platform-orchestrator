name: deploy

# Applies dev, then test, then prod. Each job runs in its GitHub environment (reviewers on test
# and prod) and logs in as that environment's infra deployer through its federated credential
# (subject repo:<owner>/<repo>:environment:<env>). Environment variables (IDs only, no secrets):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  apply:
    needs: ci
    strategy:
      max-parallel: 1
      matrix:
        environment: [dev, test, prod]
    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - run: scripts/apply.sh "$ENVIRONMENT"
        env:
          ENVIRONMENT: ${{ matrix.environment }}
