name: deploy

# Builds once, deploys to dev, then promotes the same image digests to test and prod.
# Each environment has its own GitHub environment (reviewers on test and prod), its own
# Entra federated credential (subject repo:<org>/<repo>:environment:<env>) and variables:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_LOGIN_SERVER, CONTRACT_URL
# All values are IDs and URLs, none are secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  dev:
    needs: ci
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: dev-workspace # previews change dev's workspace file too
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      images: ${{ steps.push.outputs.images }}
    steps:
      # No Azure environment yet (bootstrap not run, variables not set): skip with a notice
      # instead of failing at login on every push. Runs as normal once AZURE_CLIENT_ID is set.
      - id: configured
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::Environment dev has no AZURE_CLIENT_ID yet; nothing deployed."
          fi
      - if: steps.configured.outputs.ok
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.configured.outputs.ok
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
      - if: steps.configured.outputs.ok
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: steps.configured.outputs.ok
        run: deploy/scripts/build.sh "$GITHUB_SHA"
      - if: steps.configured.outputs.ok
        id: push
        run: |
          deploy/scripts/push.sh "$ACR_LOGIN_SERVER" "$GITHUB_SHA" images.json
          echo "images=$(jq -c . images.json)" >>"$GITHUB_OUTPUT"
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      - if: steps.configured.outputs.ok
        run: deploy/scripts/deploy.sh images.json
        env:
          CONTRACT_URL: ${{ vars.CONTRACT_URL }}

  test:
    needs: dev
    if: needs.dev.outputs.images != '' # dev deployed something to promote
    uses: ./.github/workflows/promote.yml
    permissions: # what promote.yml's job asks for: its environment's federated login
      contents: read
      id-token: write
    with:
      environment: test
      images: ${{ needs.dev.outputs.images }}

  prod:
    needs: [dev, test]
    if: needs.dev.outputs.images != ''
    uses: ./.github/workflows/promote.yml
    permissions: # what promote.yml's job asks for: its environment's federated login
      contents: read
      id-token: write
    with:
      environment: prod
      images: ${{ needs.dev.outputs.images }}
