name: promote

# Copies dev's image digests into the environment's ACR and deploys them.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      images:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.32"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          printf '%s' "$SOURCE_IMAGES" >source.json
          deploy/scripts/promote.sh source.json "$ACR_LOGIN_SERVER" images.json
          deploy/scripts/deploy.sh images.json
        env:
          SOURCE_IMAGES: ${{ inputs.images }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          CONTRACT_URL: ${{ vars.CONTRACT_URL }}
