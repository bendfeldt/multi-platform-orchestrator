# Same flow as .github/workflows/deploy.yml: build once, deploy to dev, promote the same
# digests to test and prod. Per environment it needs:
#   - an Azure Resource Manager service connection using workload identity federation
#     (names below), scoped to that environment's resource group;
#   - an ADO environment (mpo-dev, mpo-test, mpo-prod) with approvals on test and prod;
#   - a variable group (mpo-dev, ...) with ACR_LOGIN_SERVER and CONTRACT_URL.
trigger:
  branches:
    include: [main]

pr: none

parameters:
  - name: serviceConnections
    type: object
    default: { dev: mpo-dev, test: mpo-test, prod: mpo-prod }

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: ci
    jobs:
      - template: ci-jobs.yml

  - stage: dev
    dependsOn: ci
    variables:
      - group: mpo-dev
    jobs:
      - deployment: deploy
        environment: mpo-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: false
                - template: install-uv.yml
                - task: AzureCLI@2
                  name: push
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnections.dev }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      deploy/scripts/build.sh "$(Build.SourceVersion)"
                      deploy/scripts/push.sh "$ACR_LOGIN_SERVER" "$(Build.SourceVersion)" images.json
                      echo "##vso[task.setvariable variable=images;isOutput=true]$(jq -c . images.json)"
                      deploy/scripts/deploy.sh images.json
                  env:
                    ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
                    CONTRACT_URL: $(CONTRACT_URL)

  - template: promote-stage.yml
    parameters:
      environment: test
      dependsOn: [dev]
      serviceConnection: ${{ parameters.serviceConnections.test }}

  - template: promote-stage.yml
    parameters:
      environment: prod
      dependsOn: [dev, test]
      serviceConnection: ${{ parameters.serviceConnections.prod }}
